<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Layout Generator Exact Color</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #2b2b2b;
      color: #fff;
      padding: 15px;
    }

    .dashboard-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* BARIS ATAS: Dibagi 2 Kolom (50% : 50%) */
    .top-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* BARIS BAWAH: Full Lebar Kiri-Kanan */
    .bottom-row {
      width: 100%;
    }

    /* Outer Card (Panel Utama Hitam) */
    .card {
      background-color: #000000;
      border: 2px solid #000000;
      padding: 10px;
      height: 100%;
    }

    /* Sub-box Abu-abu di dalam Card */
    .inner-box {
      background-color: #3b3c3d;
      border: 1px solid #555;
      padding: 8px;
      margin-bottom: 8px;
    }

    /* Header Judul (Kotak Hitam Teks Putih Bold) */
    .card-title {
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 8px;
      text-transform: uppercase;
      background: #000;
      padding: 3px 6px;
      display: inline-block;
    }

    /* Input & Textarea */
    textarea, input[type="text"] {
      width: 100%;
      background-color: #5d636b;
      border: 1px solid #1a1a1a;
      color: #fff;
      padding: 5px 8px;
      font-size: 11px;
      font-family: monospace;
      resize: vertical;
    }

    textarea::placeholder, input::placeholder {
      color: #aaa;
    }

    .btn-group {
      display: flex;
      gap: 4px;
      margin: 6px 0;
    }

    button {
      border: none;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      border-radius: 2px;
    }

    /* Warna Tombol Persis Gambar */
    .btn-blue { background-color: #0066cc; }
    .btn-green { background-color: #008a3c; }
    .btn-orange { background-color: #e65c00; }
    .btn-pink { background-color: #aa2b57; }

    .btn-flex { flex: 1; }

    /* Layout 3 Kolom FYP */
    .fyp-columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .count-text {
      font-size: 11px;
      font-weight: bold;
      color: #4da6ff;
      margin: 4px 0;
    }

    /* List Item Akun Generator */
    .account-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0d2c4d;
      border: 1px solid #000;
      padding: 5px 8px;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .account-item button {
      background-color: #000;
      font-size: 10px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
