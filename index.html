<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Layout Generator Complete</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #2b2b2b;
      color: #fff;
      padding: 15px;
    }

    .dashboard-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* BARIS ATAS: Dibagi 2 Kolom (50% : 50%) */
    .top-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* BARIS BAWAH: Full Lebar Kiri-Kanan */
    .bottom-row {
      width: 100%;
    }

    /* Outer Card */
    .card {
      background-color: #000000;
      border: 2px solid #000000;
      padding: 10px;
      height: 100%;
    }

    /* Sub-box Abu-abu di dalam Card */
    .inner-box {
      background-color: #3b3c3d;
      border: 1px solid #555;
      padding: 8px;
      margin-bottom: 8px;
    }

    /* Header Judul */
    .card-title {
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 8px;
      text-transform: uppercase;
      background: #000;
      padding: 3px 6px;
      display: inline-block;
    }

    /* Input & Textarea */
    textarea, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background-color: #5d636b;
      border: 1px solid #1a1a1a;
      color: #fff;
      padding: 5px 8px;
      font-size: 11px;
      font-family: monospace;
      resize: vertical;
    }

    textarea::placeholder, input::placeholder {
      color: #aaa;
    }

    .btn-group {
      display: flex;
      gap: 4px;
      margin: 6px 0;
    }

    button {
      border: none;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      border-radius: 2px;
    }

    button:active {
      opacity: 0.8;
    }

    /* Warna Tombol */
    .btn-blue { background-color: #0066cc; }
    .btn-green { background-color: #008a3c; }
    .btn-orange { background-color: #e65c00; }
    .btn-pink { background-color: #aa2b57; }
    .btn-purple { background-color: #6f42c1; }
    .btn-dark { background-color: #1a1a1a; border: 1px solid #555; }

    .btn-flex { flex: 1; }

    /* File Input Styling Gabungan */
    input[type="file"] {
      display: none;
    }

    .file-label-main {
      display: inline-block;
      background: #252525;
      color: #4da6ff;
      border: 1px dashed #4da6ff;
      text-align: center;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 2px;
    }
    .file-label-main:hover {
      background: #333;
    }

    /* Layout 3 Kolom FYP */
    .fyp-columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .count-text {
      font-size: 11px;
      font-weight: bold;
      color: #4da6ff;
      margin: 4px 0;
    }

    /* CSS GAYA CANTIKA ACC PADA HASIL GENERATOR */
    .cantika-controls {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .cantika-controls button {
      width: 100%;
      border-radius: 999px;
      padding: 8px 14px;
      border: none;
      background: #72243E;
      color: #ffffff;
      font-weight: 500;
      font-size: 13px;
    }

    .cantika-controls button:hover {
      background: #4B1528;
    }

    .cantika-rows {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cantika-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #0C447C;
    }

    .cantika-row .val {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      overflow-wrap: break-word;
    }

    .cantika-row button {
      padding: 4px 8px;
      border-radius: 999px;
      border: none;
      background: #042C53;
      color: #ffffff;
      font-size: 12px;
    }

    .cantika-row button:hover {
      background: #021c36;
    }

    .spacer {
      width: 28px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="dashboard-wrapper">
    
    <!-- BARIS ATAS (USERNAME & GENERATOR AKUN) -->
    <div class="top-row">
      
      <!-- KIRI: USERNAME -->
      <div class="card">
        <div class="card-title">USERNAME</div>
        <div class="inner-box">
          <textarea id="username-input" rows="4" placeholder="USERNAME"></textarea>
          <div class="count-text" id="username-count">Jumlah: 0</div>
        </div>

        <div class="inner-box">
          <input type="text" id="username-take-count" value="1" style="margin-bottom: 5px;">
          <div class="btn-group">
            <button class="btn-blue btn-flex" onclick="getAccStandard('username')">Get ACC</button>
            <button class="btn-green btn-flex" onclick="copyAcc('username')">Copy ACC</button>
          </div>
          <!-- INPUT PASSWORD BISA DIISI MANUAL -->
          <div style="display: flex; gap: 4px;">
            <input type="text" id="username-pwd" value="" placeholder="Password">
            <button class="btn-pink" onclick="copyText('username-pwd')">📋 Copy Pwd</button>
          </div>
        </div>

        <div class="inner-box">
          <textarea id="username-output" rows="2" readonly placeholder="Hasil Get ACC akan muncul di sini"></textarea>
        </div>
      </div>

      <!-- KANAN: GENERATOR AKUN -->
      <div class="card">
        <div class="card-title">GENERATOR AKUN</div>
        
        <div style="margin-bottom: 8px;">
          <textarea id="nameInput" rows="5" placeholder="Tulis nama di sini, satu nama per baris"></textarea>
        </div>

        <div class="cantika-controls">
          <button id="btnAcak">🔄 Acak nama</button>
        </div>

        <div id="rows" class="cantika-rows"></div>
      </div>

    </div>

    <!-- BARIS BAWAH (SINGLE LOAD FILE, SAVE SISA DATA OVERWRITE, UNDO/REDO) -->
    <div class="bottom-row">
      <div class="card">
        <!-- BARIS TOMBOL AKSI UTAMA DI ATAS KOLOM BAWAH -->
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
          <label class="file-label-main">📂 Load File (.txt)
            <input type="file" accept=".txt" onchange="loadSingleFile(event)">
          </label>
          <button class="btn-orange" style="flex: 1; text-align: center;" onclick="saveSisaDataKolomBawah()">💾 Save Sisa Data (.txt)</button>
          <button class="btn-purple" onclick="undoBottomData()">↩️ Undo</button>
          <button class="btn-purple" onclick="redoBottomData()">↪️ Redo</button>
          <button class="btn-dark" onclick="clearBottomData()">🗑️ Clear Data Kolom Bawah</button>
        </div>
        
        <div class="fyp-columns">
          
          <!-- Kolom 1: TITEL FYP -->
          <div>
            <div class="card-title">TITEL FYP</div>
            <div class="inner-box">
              <textarea id="titel-input" rows="4" placeholder="Masukkan Titel FYP"></textarea>
              <div class="count-text" id="titel-count">Jumlah: 0</div>
            </div>
            <div class="inner-box">
              <input type="text" id="titel-take-count" value="1" style="margin-bottom: 4px;">
              <div class="btn-group">
                <button class="btn-blue btn-flex" onclick="getAccTitelFyp()">Get ACC</button>
                <button class="btn-green btn-flex" onclick="copyAcc('titel')">Copy ACC</button>
              </div>
            </div>
            <div class="inner-box">
              <textarea id="titel-output" rows="2" readonly placeholder="Hasil Get ACC akan muncul di sini"></textarea>
            </div>
          </div>

          <!-- Kolom 2: TOPIK -->
          <div>
            <div class="card-title">TOPIK</div>
            <div class="inner-box">
              <textarea id="topik-input" rows="4" placeholder="Masukkan Topik"></textarea>
              <div class="count-text" id="topik-count">Jumlah: 0</div>
            </div>
            <div class="inner-box">
              <input type="text" id="topik-take-count" value="1" style="margin-bottom: 4px;">
              <div class="btn-group">
                <button class="btn-blue btn-flex" onclick="getAccStandard('topik')">Get ACC</button>
                <button class="btn-green btn-flex" onclick="copyAcc('topik')">Copy ACC</button>
              </div>
            </div>
            <div class="inner-box">
              <textarea id="topik-output" rows="2" readonly placeholder="Hasil Get ACC akan muncul di sini"></textarea>
            </div>
          </div>

          <!-- Kolom 3: LINK -->
          <div>
            <div class="card-title">LINK</div>
            <div class="inner-box">
              <textarea id="link-input" rows="4" placeholder="Masukkan Link"></textarea>
              <div class="count-text" id="link-count">Jumlah: 0</div>
            </div>
            <div class="inner-box">
              <input type="text" id="link-take-count" value="1" style="margin-bottom: 4px;">
              <div class="btn-group">
                <button class="btn-blue btn-flex" onclick="getAccStandard('link')">Get ACC</button>
                <button class="btn-green btn-flex" onclick="copyAcc('link')">Copy ACC</button>
              </div>
            </div>
            <div class="inner-box">
              <textarea id="link-output" rows="2" readonly placeholder="Hasil Get ACC akan muncul di sini"></textarea>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script>
    // --- FITUR AUTO-SAVE (LOCALSTORAGE) & UNDO/REDO ---
    let historyStack = [];
    let historyStep = -1;
    let isUndoRedoAction = false;
    let fileHandle = null;

    function getBottomState() {
      return {
        titel: document.getElementById('titel-input').value,
        topik: document.getElementById('topik-input').value,
        link: document.getElementById('link-input').value,
        pwd: document.getElementById('username-pwd').value
      };
    }

    function saveToLocalStorage() {
      const currentState = getBottomState();
      localStorage.setItem('kolom_bawah_data', JSON.stringify(currentState));
    }

    function loadFromLocalStorage() {
      const savedData = localStorage.getItem('kolom_bawah_data');
      if (savedData) {
        try {
          const data = JSON.parse(savedData);
          document.getElementById('titel-input').value = data.titel || '';
          document.getElementById('topik-input').value = data.topik || '';
          document.getElementById('link-input').value = data.link || '';
          document.getElementById('username-pwd').value = data.pwd || '';
        } catch(e) {
          console.error("Gagal membaca data tersimpan", e);
        }
      }
    }

    function saveState() {
      saveToLocalStorage();

      if (isUndoRedoAction) return;

      const currentState = getBottomState();
      
      if (historyStep >= 0) {
        const last = historyStack[historyStep];
        if (last.titel === currentState.titel && last.topik === currentState.topik && last.link === currentState.link && last.pwd === currentState.pwd) {
          return;
        }
      }

      historyStack = historyStack.slice(0, historyStep + 1);
      historyStack.push(currentState);
      historyStep++;
    }

    function applyState(state) {
      isUndoRedoAction = true;
      document.getElementById('titel-input').value = state.titel;
      document.getElementById('topik-input').value = state.topik;
      document.getElementById('link-input').value = state.link;
      document.getElementById('username-pwd').value = state.pwd || '';
      updateCounts();
      saveToLocalStorage();
      isUndoRedoAction = false;
    }

    function undoBottomData() {
      if (historyStep > 0) {
        historyStep--;
        applyState(historyStack[historyStep]);
      }
    }

    function redoBottomData() {
      if (historyStep < historyStack.length - 1) {
        historyStep++;
        applyState(historyStack[historyStep]);
      }
    }

    // --- LOAD FILE SINGLE UNTUK KETIGA KOLOM BAWAH ---
    function loadSingleFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        
        if (text.includes('=== TITEL FYP ===') || text.includes('=== TOPIK ===') || text.includes('=== LINK ===')) {
          const parts = text.split(/===\s*(TITEL FYP|TOPIK|LINK)\s*===/);
          let currentHeader = '';

          for (let i = 0; i < parts.length; i++) {
            const part = parts[i].trim();
            if (part === 'TITEL FYP' || part === 'TOPIK' || part === 'LINK') {
              currentHeader = part;
            } else if (currentHeader) {
              if (currentHeader === 'TITEL FYP') document.getElementById('titel-input').value = part;
              if (currentHeader === 'TOPIK') document.getElementById('topik-input').value = part;
              if (currentHeader === 'LINK') document.getElementById('link-input').value = part;
            }
          }
        } else {
          document.getElementById('titel-input').value = text;
        }

        updateCounts();
        saveState();
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // --- SAVE SISA DATA DENGAN METODE OVERWRITE (FILE SYSTEM ACCESS API) ---
    async function saveSisaDataKolomBawah() {
      const titelData = document.getElementById('titel-input').value;
      const topikData = document.getElementById('topik-input').value;
      const linkData = document.getElementById('link-input').value;

      const content = `=== TITEL FYP ===\n${titelData}\n\n=== TOPIK ===\n${topikData}\n\n=== LINK ===\n${linkData}`;

      if ('showSaveFilePicker' in window) {
        try {
          if (!fileHandle) {
            fileHandle = await window.showSaveFilePicker({
              suggestedName: 'Sisa_Data_Kolom_Bawah.txt',
              types: [{
                description: 'Text Files',
                accept: { 'text/plain': ['.txt'] },
              }],
            });
          }

          const writable = await fileHandle.createWritable();
          await writable.write(content);
          await writable.close();
          alert('Data berhasil disimpan/ditimpa (overwritten)!');
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error('Gagal menyimpan file:', err);
          }
        }
      } else {
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Sisa_Data_Kolom_Bawah.txt';
        a.click();
      }
    }

    function clearBottomData() {
      if (confirm('Apakah Anda yakin ingin mengosongkan data kolom bawah (Titel, Topik, Link)?')) {
        document.getElementById('titel-input').value = '';
        document.getElementById('topik-input').value = '';
        document.getElementById('link-input').value = '';
        updateCounts();
        saveState();
      }
    }

    // --- PENGHITUNG DATA & GET ACC ---
    function updateCounts() {
      ['username', 'topik', 'link'].forEach(key => {
        const input = document.getElementById(`${key}-input`);
        const countDisplay = document.getElementById(`${key}-count`);
        const lines = input.value.split('\n').filter(line => line.trim() !== '');
        countDisplay.textContent = `Jumlah: ${lines.length}`;
      });

      const titelInput = document.getElementById('titel-input');
      const titelCount = document.getElementById('titel-count');
      const blocks = titelInput.value.split(/\n?#####\n?/).filter(b => b.trim() !== '');
      titelCount.textContent = `Jumlah: ${blocks.length}`;
    }

    ['titel', 'topik', 'link'].forEach(key => {
      const el = document.getElementById(`${key}-input`);
      el.addEventListener('input', () => {
        updateCounts();
        saveState();
      });
    });

    document.getElementById('username-pwd').addEventListener('input', saveState);
    document.getElementById('username-input').addEventListener('input', updateCounts);

    function getAccTitelFyp() {
      const inputEl = document.getElementById('titel-input');
      const takeCountEl = document.getElementById('titel-take-count');
      const outputEl = document.getElementById('titel-output');

      let blocks = inputEl.value.split(/\n?#####\n?/).filter(b => b.trim() !== '');
      const takeNum = parseInt(takeCountEl.value) || 1;

      if (blocks.length === 0) return;

      const takenBlocks = blocks.splice(0, takeNum);
      outputEl.value = takenBlocks.join('\n#####\n');
      inputEl.value = blocks.join('\n#####\n');

      updateCounts();
      saveState();
    }

    function getAccStandard(key) {
      const inputEl = document.getElementById(`${key}-input`);
      const takeCountEl = document.getElementById(`${key}-take-count`);
      const outputEl = document.getElementById(`${key}-output`);

      let lines = inputEl.value.split('\n').filter(line => line.trim() !== '');
      const takeNum = parseInt(takeCountEl.value) || 1;

      if (lines.length === 0) return;

      const takenItems = lines.splice(0, takeNum);
      outputEl.value = takenItems.join('\n');
      inputEl.value = lines.join('\n');

      updateCounts();
      if (['titel', 'topik', 'link'].includes(key)) {
        saveState();
      }
    }

    function copyAcc(key) {
      const outputEl = document.getElementById(`${key}-output`);
      if (outputEl.value) {
        navigator.clipboard.writeText(outputEl.value);
      }
    }

    function copyText(elementIdOrText, isDirectText = false) {
      let textToCopy = isDirectText ? elementIdOrText : document.getElementById(elementIdOrText).value;
      if (textToCopy) {
        navigator.clipboard.writeText(textToCopy);
      }
    }

    // --- LOGIKA CANTIKA ACC ---
    function digitsN(n){
      let s = '';
      for(let i=0; i<n; i++){ s += (1 + Math.floor(Math.random()*9)); }
      return s;
    }

    function splitLines(text){
      return text.split(/\r\n|\r|\n/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
    }

    let state = { fullName: '', d3: '', d4: '', d5: '', d6: '' };

    function slug(name){ return name.toLowerCase().replace(/\s+/g,''); }
    function firstName(name){ return name.trim().split(/\s+/)[0] || ''; }

    function rowConfig(){
      if(!state.fullName) return [];
      const full = slug(state.fullName);
      const first = slug(firstName(state.fullName));
      return [
        { key: 'name', value: state.fullName, editable: false, digitLen: 0 },
        { key: 'd3', value: full + state.d3, editable: true, digitLen: 5 },
        { key: 'd4', value: full + '_' + state.d4, editable: true, digitLen: 5 },
        { key: 'd5', value: first + state.d5, editable: true, digitLen: 7 },
        { key: 'd6', value: first + '_' + state.d6, editable: true, digitLen: 7 }
      ];
    }

    function render(){
      const rows = rowConfig();
      const container = document.getElementById('rows');
      container.innerHTML = '';
      rows.forEach(function(r){
        const row = document.createElement('div');
        row.className = 'cantika-row';

        const val = document.createElement('div');
        val.className = 'val';
        val.textContent = r.value;
        row.appendChild(val);

        const btnCopy = document.createElement('button');
        btnCopy.textContent = '📋';
        btnCopy.title = 'Salin';
        btnCopy.onclick = function(){
          navigator.clipboard.writeText(r.value).then(function(){
            btnCopy.textContent = '✅';
            setTimeout(function(){ btnCopy.textContent = '📋'; }, 1000);
          });
        };
        row.appendChild(btnCopy);

        if(r.editable){
          const btnUbah = document.createElement('button');
          btnUbah.textContent = '🎲';
          btnUbah.title = 'Ubah angka saja';
          btnUbah.onclick = function(){ state[r.key] = digitsN(r.digitLen); render(); };
          row.appendChild(btnUbah);
        } else {
          const spacer = document.createElement('div');
          spacer.className = 'spacer';
          row.appendChild(spacer);
        }

        container.appendChild(row);
      });
    }

    function acakSemua(){
      const names = splitLines(document.getElementById('nameInput').value);
      if(names.length === 0) {
        document.getElementById('rows').innerHTML = '';
        return;
      }
      const pick = names[Math.floor(Math.random() * names.length)];
      state = { fullName: pick, d3: digitsN(5), d4: digitsN(5), d5: digitsN(7), d6: digitsN(7) };
      render();
    }

    document.getElementById('btnAcak').onclick = acakSemua;
    document.getElementById('nameInput').addEventListener('input', acakSemua);

    // INISIALISASI SAAT HALAMAN DIBUKA
    loadFromLocalStorage();
    updateCounts();
    saveState();
    acakSemua();
  </script>

</body>
</html>
